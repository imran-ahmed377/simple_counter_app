<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7ECF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shift Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E7ECF0;
    --surface: #FFFFFF;
    --ink: #1B2632;
    --muted: #5D6B78;
    --line: #D3DBE2;
    --engage: #1F7A78;
    --demo: #2F5D8A;
    --store: #3B7A3A;
    --ship: #7A4E9A;
    --danger: #B23A3A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121820;
      --surface: #1C242E;
      --ink: #E8EDF2;
      --muted: #9AA7B4;
      --line: #2C3743;
      --engage: #3FB0AC;
      --demo: #5E93C8;
      --store: #6DB36B;
      --ship: #B286D4;
      --danger: #E06A6A;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--demo); outline-offset: 2px; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar h1 {
    margin: 0;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
    flex: 1;
  }
  .bar .date { font-size: 14px; color: var(--muted); }
  .undo {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .undo:disabled { opacity: 0.4; cursor: default; }

  nav {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 12px 10px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none;
    text-decoration: none;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--c);
  }

  main { max-width: 640px; margin: 0 auto; padding: 8px 12px 24px; }

  .stale {
    display: none;
    margin: 8px 0 4px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--surface);
    border: 2px solid var(--danger);
  }
  .stale.show { display: block; }
  .stale p { margin: 0 0 10px; }

  section { margin-top: 18px; }
  section h2 {
    margin: 0 4px 8px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--c);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  section h2 small {
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    border-radius: 12px;
    border-left: 5px solid var(--c);
    padding: 12px 12px 12px 14px;
    margin-bottom: 8px;
  }
  .label strong { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; }
  .label details { margin-top: 4px; }
  .label summary {
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .label summary::-webkit-details-marker { display: none; }
  .label summary::before { content: "+ "; }
  .label details[open] summary::before { content: "− "; }
  .label details p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .ctrl { display: flex; align-items: center; gap: 6px; }
  .minus {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    font-size: 22px;
    line-height: 1;
    color: var(--muted);
  }
  .num {
    min-width: 2ch;
    text-align: center;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .num.zero { color: var(--muted); opacity: 0.6; }
  .plus {
    width: 64px; height: 64px;
    border-radius: 16px;
    border: none;
    background: var(--c);
    color: #fff;
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
    touch-action: manipulation;
  }
  .plus:active { transform: scale(0.94); }
  .bump { animation: bump 0.18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.25); } }

  .footer {
    margin-top: 28px;
    display: grid;
    gap: 10px;
  }
  .btn {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-weight: 600;
    font-size: 16px;
  }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%) translateY(120px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.2s ease-out;
    z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .bump { animation: none; }
    .toast { transition: none; }
    .plus:active { transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Shift Counter</h1>
    <span class="date" id="date"></span>
    <button class="undo" id="undo" disabled>Undo</button>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <div class="stale" id="stale">
    <p id="staleText"></p>
    <button class="btn danger" id="staleReset" style="width:100%">Start new shift (reset to 0)</button>
  </div>
  <div id="sections"></div>

  <div class="footer">
    <button class="btn primary" id="copy">Copy summary for survey</button>
    <button class="btn danger" id="reset">Reset all to 0</button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ---- Survey layout. Edit labels here if the survey changes. ----
  const SECTIONS = [
    {
      id: "engage", title: "Engagements", color: "--engage",
      items: [
        { id: "eng_rbo",  short: "Ray-Ban/Oakley | Meta",
          q: "How many total consumers did you engage (a TWO-WAY conversation with the consumer about the product) for RayBan/Oakley | Meta today?" },
        { id: "eng_mg",   short: "Meta Glasses (Adventurer / Fury / Starfire)",
          q: "How many total consumers did you engage (a TWO-WAY conversation) for Meta Glasses [Adventurer | Fury | Starfire] today?" }
      ]
    },
    {
      id: "demo", title: "Demos", color: "--demo",
      items: [
        { id: "demo_unique", short: "Unique customers demoed",
          q: "How many total UNIQUE Customers did you provide a wearables demo (where the customer puts the device on to experience WR) to today?" },
        { id: "demo_2plus",  short: "Tried 2+ Meta products",
          q: "How many customers tried on two or more Meta wearable products?" },
        { id: "demo_rbm2",   short: "RBM 2.0 demos",
          q: "How many total RBM 2.0 demos (where the customer puts the device on to experience WR) did you perform today?" },
        { id: "demo_hstn",   short: "Oakley HSTN demos",
          q: "How many total Oakley HSTN demos (where the customer puts the device on to experience WR) did you perform today?" },
        { id: "demo_vang",   short: "Oakley Vanguard demos",
          q: "How many total Oakley Vanguard demos (where the customer puts the device on to experience WR) did you perform today?" },
        { id: "demo_mg",     short: "Meta Glasses demos",
          q: "How many total Meta Glasses [Adventurer | Fury | Starfire] hands-on demos (where the customer puts the device on to experience) did you perform today?" }
      ]
    },
    {
      id: "store", title: "In-store sales", color: "--store",
      items: [
        { id: "store_rbo",  short: "Ray-Ban/Oakley | Meta (total)",
          q: "How many Ray-Ban/Oakley | Meta (US/CA/EMEA/AU) sales did you make in-store today?" },
        { id: "store_rb2",  short: "RayBan 2.0 | Meta",
          q: "How many RayBan 2.0 | Meta (US/CA/EMEA) sales did you make in-store today?" },
        { id: "store_vang", short: "Oakley Vanguard",
          q: "How many Oakley Vanguard (US/CA/EMEA) sales did you make in-store today?" },
        { id: "store_hstn", short: "Oakley HSTN",
          q: "How many Oakley HSTN (US/CA/EMEA) sales did you make in-store today?" },
        { id: "store_mg",   short: "Meta Glasses",
          q: "How many Meta Glasses [Adventurer | Fury | Starfire] sales did you make in-store today?" }
      ]
    },
    {
      id: "ship", title: "Ship-to-home / store sales", color: "--ship",
      items: [
        { id: "ship_rbo",  short: "Ray-Ban/Oakley | Meta (total)",
          q: "How many RayBan/Oakley | Meta sales did you make today where the product was sold as ship-to-home/store?" },
        { id: "ship_rb2",  short: "RayBan 2.0 | Meta",
          q: "How many RayBan 2.0 | Meta sales did you make today where the product was sold as ship-to-home/store?" },
        { id: "ship_vang", short: "Oakley Vanguard",
          q: "How many Oakley Vanguard sales did you make today where the product was sold as ship-to-home/store?" },
        { id: "ship_hstn", short: "Oakley HSTN",
          q: "How many Oakley HSTN sales did you make today where the product was sold as ship-to-home/store?" },
        { id: "ship_mg",   short: "Meta Glasses",
          q: "How many Meta Glasses [Adventurer | Fury | Starfire] sales did you make today where the product was sold as ship-to-home/store?" }
      ]
    }
  ];

  const KEY = "shiftCounter.v1";
  const todayStr = () => new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD

  let state = load();
  let history = [];

  function blank() {
    const counts = {};
    SECTIONS.forEach(s => s.items.forEach(i => counts[i.id] = 0));
    return { day: todayStr(), counts };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        const fresh = blank();
        Object.keys(fresh.counts).forEach(k => {
          if (typeof saved.counts?.[k] === "number") fresh.counts[k] = saved.counts[k];
        });
        fresh.day = saved.day || fresh.day;
        return fresh;
      }
    } catch (e) {}
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---- Build the page ----
  const nav = document.getElementById("nav");
  const wrap = document.getElementById("sections");

  SECTIONS.forEach(sec => {
    const a = document.createElement("a");
    a.href = "#" + sec.id;
    a.textContent = sec.title;
    a.style.setProperty("--c", `var(${sec.color})`);
    nav.appendChild(a);

    const el = document.createElement("section");
    el.id = sec.id;
    el.style.setProperty("--c", `var(${sec.color})`);
    el.innerHTML = `<h2>${sec.title}<small id="sum_${sec.id}"></small></h2>`;

    sec.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="label">
          <strong>${item.short}</strong>
          <details><summary>Survey question</summary><p>${item.q}</p></details>
        </div>
        <div class="ctrl">
          <button class="minus" aria-label="Decrease ${item.short}">−</button>
          <span class="num" id="n_${item.id}" aria-live="polite">0</span>
          <button class="plus" aria-label="Increase ${item.short}">+</button>
        </div>`;
      row.querySelector(".plus").addEventListener("click", () => change(item.id, 1));
      row.querySelector(".minus").addEventListener("click", () => change(item.id, -1));
      el.appendChild(row);
    });
    wrap.appendChild(el);
  });

  function change(id, delta) {
    const next = state.counts[id] + delta;
    if (next < 0) return;
    state.counts[id] = next;
    history.push({ id, delta });
    if (history.length > 50) history.shift();
    save();
    render(id);
    if (navigator.vibrate) navigator.vibrate(delta > 0 ? 15 : [10, 40, 10]);
  }

  function render(bumpId) {
    SECTIONS.forEach(sec => {
      let total = 0;
      sec.items.forEach(i => {
        const n = document.getElementById("n_" + i.id);
        n.textContent = state.counts[i.id];
        n.classList.toggle("zero", state.counts[i.id] === 0);
        total += state.counts[i.id];
      });
      document.getElementById("sum_" + sec.id).textContent = total ? `${total} taps` : "";
    });
    if (bumpId) {
      const n = document.getElementById("n_" + bumpId);
      n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump");
    }
    document.getElementById("undo").disabled = history.length === 0;

    const d = new Date(state.day + "T00:00:00");
    document.getElementById("date").textContent =
      d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

    const stale = document.getElementById("stale");
    const hasCounts = Object.values(state.counts).some(v => v > 0);
    if (state.day !== todayStr() && hasCounts) {
      document.getElementById("staleText").textContent =
        `These counts are from ${d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}. Did you fill in the survey for that shift?`;
      stale.classList.add("show");
    } else {
      stale.classList.remove("show");
    }
  }

  function resetAll() {
    if (!confirm("Reset every counter to 0?")) return;
    state = blank();
    history = [];
    save();
    render();
    toast("All counters reset");
  }

  document.getElementById("reset").addEventListener("click", resetAll);
  document.getElementById("staleReset").addEventListener("click", resetAll);

  document.getElementById("undo").addEventListener("click", () => {
    const last = history.pop();
    if (!last) return;
    state.counts[last.id] -= last.delta;
    if (state.counts[last.id] < 0) state.counts[last.id] = 0;
    save();
    render(last.id);
    toast("Undone");
  });

  document.getElementById("copy").addEventListener("click", async () => {
    const lines = [`Shift: ${state.day}`];
    SECTIONS.forEach(sec => {
      lines.push("", sec.title.toUpperCase());
      sec.items.forEach(i => lines.push(`${i.short}: ${state.counts[i.id]}`));
    });
    const text = lines.join("\n");
    try {
      await navigator.clipboard.writeText(text);
      toast("Summary copied");
    } catch (e) {
      prompt("Copy this summary:", text);
    }
  });

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
  }

  // Re-check the day when the app comes back to the foreground
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  render();
</script>
</body>
</html>
